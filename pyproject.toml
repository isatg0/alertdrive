[build-system]
requires = ["setuptools>=68"]
build-backend = "tool.vercel.entrypoint"

[project]
name = "alertdrive"
version = "0.1.0"
description = "Plataforma de detección de somnolencia del conductor"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
